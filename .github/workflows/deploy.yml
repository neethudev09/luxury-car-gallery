name: Deploy to Hostinger

# Long-term deployment workflow:
#   1. You push/update from Lovable (which syncs to GitHub).
#   2. This workflow runs `npm run build` to produce a static site in ./dist.
#   3. Only the CONTENTS of ./dist are uploaded to Hostinger public_html via FTP.
#
# Raw source (src, public, scripts, supabase, package.json, .env, etc.) is
# NEVER uploaded — only the built static site.

on:
  push:
    branches:
      - deploy
  # Allows manual runs from the GitHub "Actions" tab.
  workflow_dispatch:

# Prevent overlapping deploys from racing each other onto the server.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Confirm dist/index.html exists
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::Build failed — dist/index.html was not generated."
            exit 1
          fi
          echo "dist/index.html found. Contents of dist/:"
          ls -la dist

      - name: Deploy contents of dist/ to Hostinger public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # IMPORTANT: trailing slash means "upload the CONTENTS of dist/",
          # not the dist folder itself.
          local-dir: ./dist/
          # Target directory on Hostinger, e.g. /public_html/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Hidden files like .htaccess ARE uploaded by default.
          # Extra safety: never let any stray source files get pushed.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/src/**
            **/public/**
            **/scripts/**
            **/supabase/**
            **/*.ts
            **/*.tsx
            package.json
            package-lock.json
            .env
