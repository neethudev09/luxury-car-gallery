name: Build static site onto deploy branch

# Workflow (matches your other Lovable + Hostinger projects):
#   1. You push/update from Lovable -> syncs to the `main` branch on GitHub.
#   2. This workflow builds the static site (npm run build -> ./dist).
#   3. The CONTENTS of ./dist (index.html, assets/, .htaccess, robots.txt,
#      sitemap.xml) are committed to the `deploy` branch — built files ONLY,
#      never source code.
#   4. Hostinger Git deployment stays connected to the `deploy` branch.
#      Click "Redeploy" in hPanel and public_html receives a normal static
#      site with index.html at the root. No FTP, no manual uploads, no Node
#      server.
#
# IMPORTANT: the `deploy` branch is now machine-managed build output.
# Do NOT merge or push source code into it manually — this workflow
# overwrites it on every run.

on:
  push:
    branches:
      - main
  # Manual "Run workflow" button in the GitHub Actions tab.
  workflow_dispatch:

# Needed so the workflow can push the built site to the deploy branch
# using the built-in GITHUB_TOKEN (no extra secrets required).
permissions:
  contents: write

concurrency:
  group: build-deploy-branch
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source (main)
        uses: actions/checkout@v4

      # This repo uses Bun's lockfile (bun.lock) — there is no
      # package-lock.json, so `npm ci` would fail. Install with Bun instead.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Confirm dist/index.html exists
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::Build failed — dist/index.html was not generated."
            exit 1
          fi
          echo "dist contents:"
          ls -la dist

      - name: Publish dist/ contents to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
          # Keep the deploy branch as a single clean snapshot of the
          # latest build (no history bloat).
          force_orphan: true
          # Dotfiles like .htaccess are included by default.
          commit_message: "Static build for Hostinger (from ${{ github.sha }})"
